name: vestibuleren
description: "Vestibulaire revalidatie oefeningen app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  audioplayers: ^6.1.0
  go_router: ^17.2.3
  intl: ^0.20.2
  fl_chart: ^1.2.0
  wakelock_plus: ^1.2.10
  flutter_markdown_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.4.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/audio/tick.wav
    - assets/icon.png
    - assets/splash.png
    - assets/exercises/
    - assets/exercises/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0C2444"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: false

flutter_native_splash:
  color: "#0C2444"
  image: assets/splash.png
  android_12:
    color: "#0C2444"
    image: assets/splash.png
  ios: true
  android: true
